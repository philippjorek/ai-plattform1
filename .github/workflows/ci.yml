name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test: Node ${{ matrix.node-version }} / ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]
        fail-fast: false


    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Report success
        run: echo "Tests on Node ${{ matrix.node-version }} / ${{ matrix.os }}"
