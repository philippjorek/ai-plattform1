# Automatic deployments

name: Deploy

on:
  push:
    branches: [main]

# Prevent multiple deployments at once
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  # 1.: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  # 2.: Build the project (CI validation only — the deploy job below does its
  # own build inside the container, straight from a fresh git checkout).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

# 3.: Deploy — runs on the self-hosted runner installed on the Ubuntu server
# itself (see DEPLOYMENT.md). The container's entrypoint clones/pulls the repo
# and builds it on its own, so this job just (re)builds the image from the
# Dockerfile and recreates the running container.

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    environment: production     # manual approval in GitHub settings (optional)

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t service-mit-herz:latest .

      - name: Recreate container
        run: |
          docker rm -f service-mit-herz-web 2>/dev/null || true
          docker run -d \
            --name service-mit-herz-web \
            --restart unless-stopped \
            -p 8082:8082 \
            -p 8090:8090 \
            -p 8091:8091 \
            -v service-mit-herz-data:/data \
            -v /srv/service-mit-herz/app.env:/run/secrets/app.env:ro \
            service-mit-herz:latest
