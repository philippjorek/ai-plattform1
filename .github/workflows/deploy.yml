# Automatic deployments

name: Deploy

on:
  push:
    branches: [main]

# Prevent multiple deployments at once
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  # 1.: Run tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm test

  # 2.: Build the project (CI validation only — the deploy job below does its
  # own build inside the container, straight from a fresh git checkout).
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

# 3.: Deploy — runs on the self-hosted runner installed on the Ubuntu server
# itself (see docs/deployment/DEPLOYMENT.md). Unlike a fresh image build, this
# updates the code *inside* the already-running "aiplattform2deploy" container
# (git pull + npm ci + npm run build via `docker exec`), then restarts that
# same container so its own startup command picks up the new build on
# port 3000. The container itself is provisioned/maintained outside this
# pipeline — see DEPLOYMENT.md for one-time setup.

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: build
    environment: production     # manual approval in GitHub settings (optional)

    env:
      CONTAINER: aiplattform2deploy
      APP_DIR: /home/www/20260706/ai-plattform1

    steps:
      - name: Pull latest code inside container
        run: docker exec "$CONTAINER" git -C "$APP_DIR" pull

      - name: Install dependencies inside container
        run: docker exec "$CONTAINER" npm --prefix "$APP_DIR" ci

      - name: Build inside container
        run: docker exec "$CONTAINER" npm --prefix "$APP_DIR" run build

      - name: Restart container to pick up new build
        run: docker restart "$CONTAINER"
